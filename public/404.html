<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #edf3ff; background: #0b1220; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { max-width: 520px; padding: 42px; border: 1px solid #263750; border-radius: 18px; background: #111c2d; text-align: center; box-shadow: 0 24px 70px #0007; }
    .code { color: #75d5c4; font-size: .8rem; font-weight: 800; letter-spacing: .2em; }
    h1 { margin: 10px 0; font-size: 2.5rem; }
    p { color: #aab8ce; line-height: 1.6; }
    a { display: inline-block; margin-top: 12px; padding: 11px 18px; border-radius: 9px; background: #75d5c4; color: #08201c; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="code">HTTP ERROR 404</div>
    <h1>Page not found</h1>
    <p>The requested page is not available on this server.</p>
    <a href="/">Return to chat</a>
  </main>
</body>
</html>
